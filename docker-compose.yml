services:
  chatbotapi_proxy:
    build:
      dockerfile: ./dockerfiles/nginx/dockerfile
      context: .
    volumes:
      - ./shared/:/shared/
    restart: always
    ports:
      - 80:80
    networks:
      - chatbotnetwork
    depends_on:
      - chatbotapi
  chatbotapi:
    build:
      dockerfile: ./dockerfiles/chatbotapi/dockerfile
      context: .
    volumes:
      - ./shared/:/shared/
    ports:
      - 3000:3000
    networks:
      - chatbotnetwork
    env_file: .env
networks:
  chatbotnetwork: