# Define os serviços que compõem a aplicação
services:
  # Serviço da API FastAPI
  api:
    container_name: chatbot-api  # Nome explícito para o container
    build:
      context: .  # Usa o diretório atual como contexto de build
      dockerfile: docker/Dockerfile.api  # Caminho para o Dockerfile da API
    ports:
      - "8080:8080"  # Expõe a porta 8080 do container para a porta 8080 do host
    env_file:
      - .env  # Carrega variáveis de ambiente do arquivo .env (configurações sensíveis)
    restart: unless-stopped  # Reinicia automaticamente, exceto se parado manualmente
    networks:
      - chatbot-network  # Conecta à rede dedicada

  # Serviço do Bot do Telegram
  bot:
    container_name: telegram-bot  # Nome explícito para o container
    build:
      context: .  # Mesmo contexto de build
      dockerfile: docker/Dockerfile.bot  # Caminho para o Dockerfile do Bot
    env_file:
      - .env  # Mesmo arquivo de variáveis de ambiente
    environment:
      - API_URL=http://api:8080/ask  # URL da API (usa nome do serviço como host)
    restart: unless-stopped  # Mesma política de reinício
    depends_on:
      - api  # Garante que a API inicie antes do bot
    networks:
      - chatbot-network  # Mesma rede

# Configuração de rede personalizada
networks:
  chatbot-network:
    driver: bridge  # Cria uma rede bridge isolada para comunicação entre serviços