services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data/chroma_db:/app/data/chroma_db
      - ../logs:/app/logs
 
  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - api
    volumes:
      - ../data/chroma_db:/app/data/chroma_db
      - ../logs:/app/logs
 